# Copy to html-deck-outline.properties and customize locally (not source controlled).
htmlDeck.header=HTML DECK OUTLINE (live-talk slides from DOCX; choose layouts per slide; voice from VOICE_STYLE_PATH).

milestones=0:Intro,1:Problem,2:Solution,3:Proof,4:Close

slides.min=8
slides.max=14

deckTitle.maxWords=12
deckTitle=Browser title and hero headline; one hook, 4-12 words (hard limit 12).

slide.title.maxWords=18
slide.title=Short slide label for navigation and timeline; sentence case; hard limit 18 words.

slide.kicker.maxWords=8
slide.kicker=Optional uppercase section label; 2-8 words.

slide.headline.maxWords=12
slide.headline=Hero layout only; main headline; hard limit 12 words.

slide.subline.maxWords=24
slide.subline=Hero or closing; semicolon-separated beats; hard limit 24 words total.

slide.bullet.maxWords=15
slide.bullet=One on-slide fragment per bullet chip; hard limit 15 words.

slide.notes.maxWords=40
slide.notes=One speaker note sentence; hard limit 40 words per note.

slide.imageQuery.maxWords=5
slide.imageQuery=Split layout only; 2-5 word Pexels query (hard limit 5).
slide.imageSide=Split layout only; optional left or right photo column; omit for right.

layout.hero=Opening slide: kicker, headline, subline beats, 0-5 icon bullets (icon names from allowlist).
layout.standard=Kicker, title, 2-4 bullet chips with icons; short beats only.
layout.split=Two columns: copy (kicker, title, bullets) plus full-height photo column; imageQuery required; optional imageSide left|right.
layout.journey=Kicker, title, 3-5 bullets as roadmap steps (icon + label each); optional ai on the path.
layout.doc=Kicker, title, 2-4 bullets as document rows; template or evidence beats.
layout.cards=Kicker, title, 2-4 bullets as large cards filling the slide.
layout.list=Kicker, title, 2-4 bullets as checklist rows with bars.
layout.closing=Title, 2-3 takeaway bullets, optional subline CTA.
