# Copy to presentation-keys.properties and customize locally (not source controlled).
# Set VOICE_STYLE_PATH in .env for tone (default: prompts/voice-styles/neutral.md; TEDx: prompts/voice-styles/tedx.md).
presentationKeys.header=PRESENTATION KEYS (live-talk slides, not infodeck or pre-read; fill from DOCX; fragments only; voice from VOICE_STYLE_PATH). Hard word limits: output is rejected if any key exceeds its limit.

shortProjectDescription.maxWords=10
shortProjectDescription=One hook fragment, 4-10 words max (hard limit 10). Describe the initiative, not the project name.

problem1.maxWords=15
problem1=First problem beat; one fragment, 6-12 words typical (hard limit 15); vivid stakes; one beat only.
problem2.maxWords=15
problem2=Second problem beat; one fragment, 6-12 words typical (hard limit 15); deepen tension; do not repeat problem1.
persona.maxWords=15
persona=Who has this problem? One fragment, 4-10 words typical (hard limit 15); concrete and relatable.
currentSolution1.maxWords=15
currentSolution1=Today's workaround; one fragment, 6-12 words typical (hard limit 15).
currentSolution2.maxWords=15
currentSolution2=Second workaround; one fragment, 6-12 words typical (hard limit 15).
scale.maxWords=18
scale=Scale of the problem; 1-2 fragments (6-18 words total, hard limit 18); lead with a number or contrast.
whyNow.maxWords=18
whyNow=Why solve now; 1-2 fragments (6-18 words total, hard limit 18); urgency without exaggerating.
ifUnsolved.maxWords=18
ifUnsolved=Cost of inaction; 1-2 fragments (6-18 words total, hard limit 18).
architectureApproach.maxWords=18
architectureApproach=Solution architecture headline; 1-2 fragments joined by semicolon (10-18 words total, hard limit 18); story turn, not a spec list.
approachReasons.maxWords=18
approachReasons=Why this approach; 1-2 fragments joined by semicolon (10-18 words total, hard limit 18).
personaBetterment.maxWords=18
personaBetterment=Persona payoff; 1-2 fragments (6-18 words total, hard limit 18).
appfireBetterment.maxWords=18
appfireBetterment=Organization value (time, customers, retention); 1-2 fragments (6-18 words total, hard limit 18).
estimatedImpact.maxWords=18
estimatedImpact=Impact headline; 1-2 fragments joined by semicolon (10-18 words total, hard limit 18); lead with a number when the DOCX has one.
currentState.maxWords=18
currentState=Current solution state; 1-2 fragments (6-18 words total, hard limit 18).
sprintsToDeliver.maxWords=10
sprintsToDeliver=Sprints to production; one fragment, 4-10 words (hard limit 10, 2-week sprints).
nonDevCosts.optional=true
nonDevCosts.maxWords=18
nonDevCosts=Optional non-dev costs; 1-2 fragments (6-18 words total, hard limit 18) if applicable. Omit the key entirely when not applicable.
problemSolvingImg.type=image
problemSolvingImg.maxWords=5
problemSolvingImg=Concrete Pexels scene for the problem beat on this slide (specific situation from DOCX, not generic "team brainstorming").
architectureApproachImg.type=image
architectureApproachImg.maxWords=5
architectureApproachImg=Concrete visual metaphor for the architecture beat (e.g. blueprint, bridge, control room) tied to DOCX themes.
valueImpactImg.type=image
valueImpactImg.maxWords=5
valueImpactImg=Concrete scene showing payoff or relief after the solution (specific outcome mood, not generic "success handshake").
